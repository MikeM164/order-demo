version: 0.0
os: linux

files:
  - source: /
    destination: /opt/order-demo/
    overwrite: true

hooks:
  BeforeInstall:
    - location: install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStop:
    - location: stop_server.sh
      timeout: 60
      runas: ec2-user

  ApplicationStart:
    - location: start_server.sh
      timeout: 60
      runas: ec2-user
