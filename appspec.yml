version: 0.0
os: linux
files:
  - source: order-demo.jar
    destination: /home/ubuntu
  - source: scripts
    destination: /home/ubuntu/scripts
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 20
      runas: ubuntu
  BeforeInstall:
    - location: scripts/install.sh
      timeout: 20
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 20
      runas: ubuntu