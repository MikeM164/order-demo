version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/order-demo
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 20
      runas: ubuntu
  BeforeInstall:
    - location: scripts/install.sh
      timeout: 20
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 20
      runas: ubuntu